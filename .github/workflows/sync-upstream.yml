name: Sync Upstream

on:
  schedule:
    # 每天北京时间早 8 点自动同步一次
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/throneproj/ThroneForAndroid.git
          git fetch upstream main

      - name: Check upstream commits
        id: check
        run: |
          AHEAD=$(git rev-list --count HEAD..upstream/main)
          echo "upstream has $AHEAD new commits"
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT

      - name: Merge and push
        if: steps.check.outputs.ahead != '0'
        id: merge
        run: |
          set -euo pipefail
          if git merge upstream/main --no-edit --no-ff; then
            git push origin main
            echo "✅ Synced cleanly"
            exit 0
          fi
          # 本仓库维护自己的版本号，上游只动内核 ref：只有 nb4a.properties 冲突时自动按规则解决
          CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ *$//')
          echo "conflicts: [$CONFLICTS]"
          if [ "$CONFLICTS" != "nb4a.properties" ]; then
            echo "::error::unexpected merge conflicts: [$CONFLICTS]"
            exit 1
          fi
          CORE_REF=$(git show upstream/main:nb4a.properties | sed -n 's/^THRONE_CORE_REF=//p' | tr -d '\r')
          git checkout --ours nb4a.properties
          if [ -n "$CORE_REF" ]; then
            sed -i "s#^THRONE_CORE_REF=.*#THRONE_CORE_REF=${CORE_REF}#" nb4a.properties
          fi
          git add nb4a.properties
          git commit --no-edit
          git push origin main
          echo "✅ Synced, kept our VERSION_NAME/VERSION_CODE, adopted upstream core ref"

      - name: Bump patch version
        if: steps.check.outputs.ahead != '0'
        id: bump
        run: |
          set -euo pipefail
          OLD=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          CODE=$(sed -n 's/^VERSION_CODE=//p' nb4a.properties | tr -d '\r[:space:]')
          MAJOR_MINOR=$(echo "$OLD" | cut -d. -f1,2)
          PATCH=$(echo "$OLD" | cut -d. -f3)
          NEW="${MAJOR_MINOR}.$((PATCH + 1))"
          sed -i "s#^VERSION_NAME=.*#VERSION_NAME=${NEW}#" nb4a.properties
          sed -i "s#^VERSION_CODE=.*#VERSION_CODE=$((CODE + 1))#" nb4a.properties
          # 下载链接跟着新版本走
          sed -i "s/${OLD}/${NEW}/g" README.md
          git add nb4a.properties README.md
          git commit -m "chore(release): bump to ${NEW} (auto sync)"
          git push origin main
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "✅ bumped ${OLD} -> ${NEW}"

      - name: Auto tag for release
        if: steps.check.outputs.ahead != '0'
        id: tag
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists, skip auto release"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$TAG" -m "Auto release $TAG (synced from upstream)"
            git push origin "$TAG"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "✅ Auto release $TAG triggered"
          fi

      - name: Open issue on conflict
        if: failure() && steps.check.outputs.ahead != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ 上游同步失败 ${new Date().toISOString().slice(0,10)}`;
            const body = `自动同步上游 [ThroneForAndroid](https://github.com/throneproj/ThroneForAndroid) 时失败（合并冲突或构建前检查未通过）。

            **手动处理步骤：**
            \`\`\`bash
            git clone https://github.com/${{ github.repository }}.git
            cd $(basename ${{ github.repository }})
            git remote add upstream https://github.com/throneproj/ThroneForAndroid.git
            git fetch upstream
            git merge upstream/main
            # 解决冲突后 push
            \`\`\`

            详情可查看 [本次 Actions 日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sync-conflict']
              });
            }
